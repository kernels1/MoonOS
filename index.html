<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonOS Web Demo</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body style="background-color: #121212; color: #00ff00; font-family: monospace; padding: 20px;">
    <h1>MoonOS Live Terminal</h1>
    
    <!-- Container where python output will print on screen -->
    <div id="terminal"></div>

    <script type="py">
from pyscript import display

# Use display() with target to write text to the HTML page directly
display("Welcome to MoonOS!", target="terminal")
display("System initialized and ready.", target="terminal")
    </script>
</body>
</html>
